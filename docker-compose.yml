services:
  postgres:
    image: postgres:16-alpine
    container_name: gobasic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-gobasic}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-gobasic}
      POSTGRES_DB: ${PG_DATABASE:-gobasic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-gobasic} -d ${PG_DATABASE:-gobasic}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
